<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unprocessable Content – Attend</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 3rem;
      text-align: center;
      max-width: 28rem;
      width: 100%;
    }
    
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: #fef3c7;
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.75rem;
    }
    
    p {
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      background: #f59e0b;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: #d97706;
    }
    
    .logo {
      width: 3rem;
      height: 3rem;
      margin-bottom: 1.5rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      }
      .container {
        background: #1f2937;
      }
      .error-code {
        color: #78350f;
      }
      h1 {
        color: #f9fafb;
      }
      p {
        color: #9ca3af;
      }
    }
  </style>
  <script async src="https://plausible.io/js/pa-_d2ghIq2L9Mv3kvZk8u3A.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
    plausible("422", { props: { path: document.location.pathname } })
  </script>
</head>
<body>
  <div class="container">
    <img src="/hackclub-logo.png" alt="Hack Club" class="logo">
    <div class="error-code">422</div>
    <h1>Unprocessable Content</h1>
    <p>The request was well-formed but couldn't be processed. This might be due to a security issue or invalid data.</p>
    <a href="/" class="btn">Go Home</a>
  </div>
</body>
</html>
