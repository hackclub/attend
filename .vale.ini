# Vale — prose linter for the Markdown docs in this repo.
# https://vale.sh
#
# After changing `Packages`, run `vale sync`. Lint everything with `vale .`,
# or a subset with `vale README.md` / `vale docs/`.

StylesPath = .vale/styles
MinAlertLevel = warning

Packages = Microsoft

Vocab = Attend

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# URLs and Slack channel handles aren't prose; "attend" in a repo path is not
# a lowercased product name.
TokenIgnores = (https?://\S+), (#[a-z0-9][a-z0-9-]*)

# House style: we write spaced em dashes ( — ), which Microsoft's guide forbids.
Microsoft.Dashes = NO


# The participant help articles are written to a teenager registering for an
# event, not to an enterprise administrator, and Microsoft's guide fights that
# on purpose-built ground:
#
#   FirstPerson/We — the FAQ headings are the reader's own words ("My ticket
#     won't load"), and we answer as people ("email us, a real human reads
#     it"). Stripping either would make the page colder and no clearer.
#   UIVerbs — "click" is what the instruction actually means on the web app
#     these articles document.
#   HeadingPunctuation — FAQ headings are questions and end in question marks.
#
# The rest of the repo's prose stays on the full Microsoft style.
[docs/participants/**]
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.UIVerbs = NO
Microsoft.HeadingPunctuation = NO

# Not hand-written prose: agent instruction files (.claude/ is gitignored).
# Declared last so it overrides the section above.
[.claude/**]
BasedOnStyles =
